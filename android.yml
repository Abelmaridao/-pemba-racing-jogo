name: Gerar APK Android

# Corre quando carregas em "Run workflow" (e a cada alteração). Se o repositório só tiver o .zip, descompacta-o aqui mesmo.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: PembaRacing

jobs:
  # 1) Testes automáticos do jogo (menu, garagem, condução, câmaras, pausa...)
  testes:
    name: Testes automáticos
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar o projeto (descompacta o .zip se for preciso)
        run: |
          if [ ! -f project.godot ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then echo "ERRO: nao ha project.godot nem ficheiro .zip no repositorio"; exit 1; fi
            command -v unzip >/dev/null 2>&1 || (apt-get update && apt-get install -y unzip)
            rm -rf _pz; mkdir _pz; unzip -q -o "$ZIP" -d _pz
            P=$(find _pz -name project.godot | head -n 1)
            if [ -z "$P" ]; then echo "ERRO: o zip nao tem project.godot"; exit 1; fi
            cp -a "$(dirname "$P")"/. .
            rm -rf _pz
          fi
          ls -la
      - name: Importar o projecto
        run: godot --headless --path . --import || true
      - name: Correr os testes
        run: |
          godot --headless --path . --fixed-fps 60 -- --selftest 2>&1 | grep -v 'mesh_get_surface_count\|Parameter "m" is null' | tee teste.log
          grep -q "0 falhas" teste.log

  # 2) APK (instalável no Android)
  apk:
    name: APK Android
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar o projeto (descompacta o .zip se for preciso)
        run: |
          if [ ! -f project.godot ]; then
            ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then echo "ERRO: nao ha project.godot nem ficheiro .zip no repositorio"; exit 1; fi
            command -v unzip >/dev/null 2>&1 || (apt-get update && apt-get install -y unzip)
            rm -rf _pz; mkdir _pz; unzip -q -o "$ZIP" -d _pz
            P=$(find _pz -name project.godot | head -n 1)
            if [ -z "$P" ]; then echo "ERRO: o zip nao tem project.godot"; exit 1; fi
            cp -a "$(dirname "$P")"/. .
            rm -rf _pz
          fi
          ls -la
      - name: Preparar modelos de exportação
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Preparar Android (chave de depuração + caminhos)
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "$(pwd)/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOT
      - name: Importar o projecto
        run: godot --headless --path . --import || true
      - name: Exportar o APK
        run: |
          mkdir -v -p build/android
          godot --headless --path . --export-debug "Android" build/android/${EXPORT_NAME}.apk
          ls -la build/android
      - uses: actions/upload-artifact@v4
        with:
          name: PembaRacing-APK
          path: build/android/${{ env.EXPORT_NAME }}.apk
